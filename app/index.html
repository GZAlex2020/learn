<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小学知识复习">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2c5282">
  <title>小学知识复习</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #ebf8ff 0%, #f0fff4 50%, #fefcbf 100%);
      min-height: 100vh;
      min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    header { text-align: center; padding: 20px 0 20px; }
    header h1 { font-size: 26px; color: #2c5282; margin-bottom: 8px; }
    header p { color: #4a5568; font-size: 15px; line-height: 1.5; }
    .cards { display: flex; flex-direction: column; gap: 16px; }
    .card {
      display: block;
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border: 3px solid transparent;
      transition: transform 0.15s;
    }
    .card:active { transform: scale(0.98); }
    .card-yu { border-color: #bee3f8; }
    .card-shu { border-color: #c6f6d5; }
    .card-icon { font-size: 48px; margin-bottom: 8px; }
    .card h2 { font-size: 22px; color: #2d3748; margin-bottom: 6px; }
    .card p { font-size: 14px; color: #718096; }
    .install-tip {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.9);
      border-radius: 14px;
      font-size: 13px;
      color: #4a5568;
      line-height: 1.65;
    }
    .install-tip a { color: #2b6cb0; }
    .install-tip code { background: #edf2f7; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .badge {
      display: inline-block;
      background: #48bb78;
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
    }
    #offline-status { font-size: 12px; color: #38a169; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📚 小学知识复习</h1>
      <p>一二年级 · 语文 + 数学互动练习<br>支持 iPad 安装到桌面 · 安卓请用 APK 安装包</p>
      <div id="offline-status"></div>
    </header>

    <div class="cards">
      <a class="card card-yu" href="../语文/网页互动/index.html">
        <div class="card-icon">📖</div>
        <h2>语文练习</h2>
        <p>拼音 · 识字 · 课文通关 · 读题训练</p>
      </a>
      <a class="card card-shu" href="../数学/网页互动/index.html">
        <div class="card-icon">🔢</div>
        <h2>数学练习</h2>
        <p>口算 · 概念 · 读题 · 乘法口诀</p>
      </a>
      <a class="card" href="records.html" style="border-color: #e9d8fd;">
        <div class="card-icon">📋</div>
        <h2>学习记录</h2>
        <p>各模块练习时间、进度与成绩</p>
      </a>
    </div>

    <div class="install-tip" id="platform-install-tip">
      加载中…
    </div>
  </div>

  <script src="install.js"></script>
  <script src="js/android-back.js"></script>
  <script>
    if (window.AppBackNav) {
      window.AppBackNav.onBack(function () {
        try {
          window.Capacitor.Plugins.App.exitApp();
        } catch (e) { /* ignore */ }
        return true;
      });
    }
  </script>
  <script>
    if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
      navigator.serviceWorker.register('../sw.js', { scope: '/' }).then(function () {
        var el = document.getElementById('offline-status');
        if (el && !window.matchMedia('(display-mode: standalone)').matches) {
          el.textContent = '✓ 已启用离线缓存，安装后可断网练习';
        }
      }).catch(function () {});
    }
  </script>
</body>
</html>
